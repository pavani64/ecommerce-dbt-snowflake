version: 2

models:
  - name: dim_sellers
    description: "Seller dimension containing one record per seller."

    columns:
      - name: seller_id
        description: "Unique identifier of the seller."
        data_tests:
          - unique
          - not_null

      - name: seller_zip_code_prefix
        description: "Seller ZIP code prefix."

      - name: seller_city
        description: "City where the seller is located."
        data_tests:
          - not_null

      - name: seller_state
        description: "Brazilian state where the seller is located."
        data_tests:
          - not_null