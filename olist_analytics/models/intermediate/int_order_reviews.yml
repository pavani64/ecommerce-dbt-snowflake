version: 2

models:
  - name: int_order_reviews
    description: "Order review data enriched with a categorical interpretation of the review score."

    columns:
      - name: review_id
        description: "Review identifier provided by the source dataset."
        data_tests:
          - not_null

      - name: order_id
        description: "Identifier of the order being reviewed."
        data_tests:
          - not_null

      - name: review_score
        description: "Customer review score from 1 to 5."
        data_tests:
          - not_null

      - name: review_score_category
        description: "Categorical classification of the review score."
        data_tests:
          - not_null

      - name: review_creation_date
        description: "Date when the review was created."
        data_tests:
          - not_null

      - name: review_answer_timestamp
        description: "Timestamp when the review was answered."
        data_tests:
          - not_null