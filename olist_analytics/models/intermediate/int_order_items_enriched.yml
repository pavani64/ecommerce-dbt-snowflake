version: 2

models:
  - name: int_order_items_enriched
    description: "Order item-level dataset enriched with product and seller information."

    columns:
      - name: order_id
        description: "Identifier of the order."
        data_tests:
          - not_null

      - name: order_item_id
        description: "Sequential item number within an order."
        data_tests:
          - not_null

      - name: product_id
        description: "Identifier of the product."
        data_tests:
          - not_null

      - name: seller_id
        description: "Identifier of the seller."
        data_tests:
          - not_null

      - name: product_category_name
        description: "Original product category name in Portuguese."

      - name: seller_city
        description: "City where the seller is located."

      - name: seller_state
        description: "Brazilian state where the seller is located."

      - name: shipping_limit_date
        description: "Date by which the seller should ship the item."
        data_tests:
          - not_null

      - name: price
        description: "Price of the order item."
        data_tests:
          - not_null

      - name: freight_value
        description: "Freight value charged for the order item."
        data_tests:
          - not_null