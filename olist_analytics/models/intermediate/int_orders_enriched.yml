version: 2

models:
  - name: int_orders_enriched
    description: "Order-level dataset enriched with customer information."

    columns:
      - name: order_id
        description: "Unique identifier of the order."
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "Identifier linking the order to the customer."
        data_tests:
          - not_null

      - name: order_status
        description: "Current status of the order."
        data_tests:
          - not_null

      - name: customer_unique_id
        description: "Identifier representing the unique customer."

      - name: customer_city
        description: "Customer city."

      - name: customer_state
        description: "Customer Brazilian state."