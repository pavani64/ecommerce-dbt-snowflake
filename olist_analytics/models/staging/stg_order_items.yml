version: 2

models:
  - name: stg_order_items
    description: "Staging model for Olist order line items."

    columns:
      - name: order_id
        description: "Identifier of the order."
        data_tests:
          - not_null

      - name: order_item_id
        description: "Sequential item number within an order."
        data_tests:
          - not_null

      - name: product_id
        description: "Identifier of the product."
        data_tests:
          - not_null

      - name: seller_id
        description: "Identifier of the seller."
        data_tests:
          - not_null

      - name: shipping_limit_date
        description: "Date by which the seller should ship the item."
        data_tests:
          - not_null

      - name: price
        description: "Price of the item."
        data_tests:
          - not_null

      - name: freight_value
        description: "Freight value charged for the item."
        data_tests:
          - not_null